            <!-- Metrics Cards Grid -->
            <section class="grid grid-cols-1 md:grid-cols-4 gap-gutter mb-lg">
                <div class="bg-emerald-600 text-white border-2 border-slate-900 p-lg hard-shadow rounded-DEFAULT">
                    <span class="font-label-caps text-label-caps text-emerald-200 uppercase tracking-wider block mb-2">Best Model</span>
                    <div class="font-h3 text-h3 text-white leading-none font-bold" id="ml-best-model">--</div>
                    <span class="text-xs text-emerald-200 mt-1 block">Selected by performance</span>
                </div>
                <div class="bg-white border-2 border-slate-900 p-lg hard-shadow rounded-DEFAULT">
                    <span class="font-label-caps text-label-caps text-slate-500 uppercase tracking-wider block mb-2">R² Score (Accuracy)</span>
                    <div class="font-h3 text-h3 text-slate-900 leading-none font-bold" id="ml-r2-score">--%</div>
                    <span class="text-xs text-emerald-600 font-bold mt-1 block">Goodness of Fit</span>
                </div>
                <div class="bg-white border-2 border-slate-900 p-lg hard-shadow rounded-DEFAULT">
                    <span class="font-label-caps text-label-caps text-slate-500 uppercase tracking-wider block mb-2">Mean Absolute Error (MAE)</span>
                    <div class="font-h3 text-h3 text-slate-900 leading-none font-bold" id="ml-mae">--°C</div>
                    <span class="text-xs text-slate-500 mt-1 block">Avg absolute deviation</span>
                </div>
                <div class="bg-slate-900 text-white border-2 border-slate-900 p-lg hard-shadow rounded-DEFAULT">
                    <span class="font-label-caps text-label-caps text-slate-400 uppercase tracking-wider block mb-2">RMSE (Root MSE)</span>
                    <div class="font-h3 text-h3 text-emerald-400 leading-none font-bold" id="ml-rmse">--°C</div>
                    <span class="text-xs text-slate-400 mt-1 block font-bold">Standard deviation of residuals</span>
                </div>
            </section>

            <!-- Main Layout Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter">
                <!-- Left Panel: Global Feature Impact -->
                <div class="lg:col-span-6 flex flex-col gap-gutter">
                    <!-- Global Feature Importance Bar Chart -->
                    <div class="bg-white border-2 border-slate-900 hard-shadow rounded-DEFAULT flex flex-col">
                        <div class="bg-emerald-600 border-b-2 border-slate-900 p-4">
                            <h3 class="font-h3 text-h3 text-white uppercase tracking-tight m-0">GLOBAL FEATURE IMPORTANCE</h3>
                        </div>
                        <div class="p-lg">
                            <p class="text-sm text-secondary mb-4">Relative importance of each feature in predicting room temperature. Higher value means more influence.</p>
                            <div class="flex flex-col gap-3" id="ml-importance-bars">
                                <!-- Bars will be dynamically injected -->
                            </div>
                        </div>
                    </div>

                    <!-- Global Beeswarm Explanation Plot -->
                    <div class="bg-white border-2 border-slate-900 hard-shadow rounded-DEFAULT flex flex-col">
                        <div class="bg-slate-900 border-b-2 border-slate-900 p-4">
                            <h3 class="font-h3 text-h3 text-white uppercase tracking-tight m-0">SHAP SUMMARY PLOT (BEESWARM)</h3>
                        </div>
                        <div class="p-lg text-center bg-slate-50">
                            <p class="text-sm text-secondary mb-4 text-left">Shows feature values and their positive/negative impact direction on temperature prediction.</p>
                            <img src="ml_plots/shap_summary.png" alt="SHAP Summary Plot" class="max-w-full mx-auto border-2 border-slate-900 shadow-sm" onerror="this.src='https://placehold.co/600x400?text=No+Summary+Plot+Available'"/>
                        </div>
                    </div>
                </div>

                <!-- Right Panel: Local/Explainable Predictions -->
                <div class="lg:col-span-6 flex flex-col gap-gutter">
                    <!-- Latest Sample Local Explanation -->
                    <div class="bg-white border-2 border-slate-900 hard-shadow rounded-DEFAULT flex flex-col">
                        <div class="bg-slate-900 border-b-2 border-slate-900 p-4">
                            <h3 class="font-h3 text-h3 text-white m-0 uppercase tracking-tight">LATEST TELEMETRY EXPLANATION</h3>
                        </div>
                        <div class="p-lg">
                            <div class="flex justify-between items-center mb-6 p-4 bg-emerald-50 border-2 border-slate-900">
                                <div>
                                    <span class="text-xs font-bold text-emerald-800 uppercase tracking-widest block">Actual Temp</span>
                                    <div class="text-3xl font-black text-slate-900" id="ml-actual-temp">--°C</div>
                                </div>
                                <div class="text-slate-400 text-2xl font-bold">➔</div>
                                <div>
                                    <span class="text-xs font-bold text-emerald-800 uppercase tracking-widest block">Predicted Temp</span>
                                    <div class="text-3xl font-black text-emerald-600" id="ml-pred-temp">--°C</div>
                                </div>
                            </div>
                            
                            <h4 class="font-bold text-slate-900 uppercase text-sm mb-3">SHAP Waterfall Analysis (How prediction was formed)</h4>
                            <p class="text-sm text-secondary mb-4">Base Room Temperature is <strong id="ml-base-temp">--°C</strong>. Individual telemetry features pushed it up or pulled it down to reach the prediction:</p>
                            
                            <div class="flex flex-col gap-2 mb-6" id="ml-waterfall-list">
                                <!-- Injected single values -->
                            </div>

                            <!-- Waterfall Plot Image -->
                            <div class="text-center bg-slate-50 p-2 border-2 border-slate-900">
                                <img src="ml_plots/shap_waterfall_latest.png" alt="SHAP Waterfall Plot" class="max-w-full mx-auto" onerror="this.src='https://placehold.co/600x400?text=No+Waterfall+Plot+Available'"/>
                            </div>
                        </div>
                    </div>

                    <!-- Under the Hood: Feature Dependence -->
                    <div class="bg-white border-2 border-slate-900 hard-shadow rounded-DEFAULT flex flex-col">
                        <div class="bg-emerald-600 border-b-2 border-slate-900 p-4">
                            <h3 class="font-h3 text-h3 text-white uppercase tracking-tight m-0">FEATURE CORRELATIONS (SHAP DEPENDENCE)</h3>
                        </div>
                        <div class="p-lg">
                            <p class="text-sm text-secondary mb-4">Plots showing the exact relationship between a feature's values and its corresponding SHAP value (impact score).</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="border-2 border-slate-900 p-2 text-center bg-slate-50">
                                    <span class="text-xs font-bold block mb-1">Kelembaban Dependence</span>
                                    <img src="ml_plots/shap_dependence_kelembaban.png" alt="Kelembaban Dependence" class="max-w-full mx-auto" onerror="this.src='https://placehold.co/300x200?text=No+Data'"/>
                                </div>
                                <div class="border-2 border-slate-900 p-2 text-center bg-slate-50">
                                    <span class="text-xs font-bold block mb-1">Day of Week Dependence</span>
                                    <img src="ml_plots/shap_dependence_day_of_week.png" alt="Day of Week Dependence" class="max-w-full mx-auto" onerror="this.src='https://placehold.co/300x200?text=No+Data'"/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Models Comparison Table -->
            <section class="mt-lg bg-white border-2 border-slate-900 hard-shadow rounded-DEFAULT overflow-x-auto">
                <div class="bg-slate-900 p-4 border-b-2 border-slate-900">
                    <h3 class="font-h3 text-h3 text-white uppercase tracking-tight m-0">REGRESSION MODELS COMPARISON</h3>
                </div>
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="bg-emerald-50 text-slate-900 border-b-2 border-slate-900">
                            <th class="p-md font-label-caps text-label-caps uppercase tracking-wider">Model Name</th>
                            <th class="p-md font-label-caps text-label-caps uppercase tracking-wider">Mean Absolute Error (MAE)</th>
                            <th class="p-md font-label-caps text-label-caps uppercase tracking-wider">Root Mean Squared Error (RMSE)</th>
                            <th class="p-md font-label-caps text-label-caps uppercase tracking-wider">R² Score (Accuracy)</th>
                            <th class="p-md font-label-caps text-label-caps uppercase tracking-wider text-right">Status</th>
                        </tr>
                    </thead>
                    <tbody class="font-body-md text-body-md text-on-surface" id="ml-models-tbody">
                        <!-- Injected rows -->
                    </tbody>
                </table>
            </section>
        </main>
    </template>

    <script src="app.js"></script>
</body>
</html>
